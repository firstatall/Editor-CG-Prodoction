<script src="thailand.js"></script></head><body>
<script type="module">
import { loadFonts, FPS } from './kit.js';
import { CLIPS } from './scenes1.js';
const name = new URLSearchParams(location.search).get('clip');
window.listClips = () => Object.entries(CLIPS).map(([n, c]) => ({ name: n, dur: c.dur, mode: c.mode, desc: c.desc }));
(async () => {
  await loadFonts();
  if (name) { const c = CLIPS[name]; window.clipInfo = { dur: c.dur, mode: c.mode }; window.update = await c.build(); }
  window.renderFrame = f => { window.update(f / FPS); return true; };
  window.grab = (type, q) => document.querySelector('canvas').toDataURL(type, q);
  window.ready = true;
})().catch(e => { window.err = e.stack || String(e); });
</script></body></html>
